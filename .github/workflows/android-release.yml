name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Check signing secrets
        env:
          BMS_KEYSTORE_BASE64: ${{ secrets.BMS_KEYSTORE_BASE64 }}
          BMS_KEYSTORE_PASSWORD: ${{ secrets.BMS_KEYSTORE_PASSWORD }}
          BMS_KEY_ALIAS: ${{ secrets.BMS_KEY_ALIAS }}
          BMS_KEY_PASSWORD: ${{ secrets.BMS_KEY_PASSWORD }}
        run: |
          test -n "$BMS_KEYSTORE_BASE64"
          test -n "$BMS_KEYSTORE_PASSWORD"
          test -n "$BMS_KEY_ALIAS"
          test -n "$BMS_KEY_PASSWORD"

      - name: Restore private release signing key
        env:
          BMS_KEYSTORE_BASE64: ${{ secrets.BMS_KEYSTORE_BASE64 }}
        run: printf '%s' "$BMS_KEYSTORE_BASE64" | base64 -d > android/app/bms-release.keystore

      - name: Build release APK
        env:
          BMS_KEYSTORE_PASSWORD: ${{ secrets.BMS_KEYSTORE_PASSWORD }}
          BMS_KEY_ALIAS: ${{ secrets.BMS_KEY_ALIAS }}
          BMS_KEY_PASSWORD: ${{ secrets.BMS_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace --no-daemon

      - name: Verify release signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/release/signature.txt
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/app-release.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Mod-Studio-Android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.sha256
            android/app/build/outputs/apk/release/signature.txt
          if-no-files-found: error
