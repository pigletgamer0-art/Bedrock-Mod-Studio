name: Android APK Smoke

on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

jobs:
  emulator-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Bedrock-Mod-Studio-Android-debug
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK=$(find artifact -name '*.apk' -type f | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.bedrockmodstudio.app || true
            adb shell am start -W -n com.bedrockmodstudio.app/.MainActivity | tee android-launch.txt
            grep -q "Status: ok" android-launch.txt
            sleep 5
            PID=$(adb shell pidof com.bedrockmodstudio.app | tr -d '\r')
            test -n "$PID"
            adb exec-out screencap -p > android-smoke.png
            adb shell dumpsys activity top > android-activity.txt
            grep -q "com.bedrockmodstudio.app" android-activity.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Mod-Studio-Android-smoke
          path: |
            android-launch.txt
            android-activity.txt
            android-smoke.png
          if-no-files-found: warn
